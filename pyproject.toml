[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stopscrolling"
version = "0.1.0"
description = "Webcam-based study assistant that notices when you pick up your phone."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mediapipe>=0.10.14",
    "opencv-python>=4.9",
    "numpy>=1.26",
    "onnxruntime>=1.17",
    "tokenizers>=0.15",
    "pygame>=2.5",
    "pillow>=10.1",
]

[project.scripts]
stopscrolling = "stopscrolling.app:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
