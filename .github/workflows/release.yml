name: Build & release

# Push a tag like v0.1.0 to build Windows / macOS / Linux executables and publish a release.
# "Run workflow" (manual) builds the executables as downloadable artifacts without releasing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # libEGL + libGLESv2: required by mediapipe's libmediapipe.so
          sudo apt-get install -y libgl1 libglib2.0-0 libegl1 libgles2 libxkbcommon0 xvfb

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c packaging/constraints.txt -e ".[dev]" pyinstaller

      - name: Unit tests
        if: runner.os != 'Linux'
        run: python -m pytest -q

      - name: Unit tests (virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest -q

      - name: Build, self-test and archive
        run: python packaging/build.py

      - uses: actions/upload-artifact@v4
        with:
          name: StopScrolling-${{ matrix.os }}
          path: |
            dist/StopScrolling-*.zip
            dist/StopScrolling-*.tar.gz
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -lh artifacts
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --title "StopScrolling $GITHUB_REF_NAME" \
            --notes-file packaging/RELEASE_NOTES.md
